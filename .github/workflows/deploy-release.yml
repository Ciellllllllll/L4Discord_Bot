name: Deploy release to VPS

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-release
      cancel-in-progress: true

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/L4_DiscordBot

            git fetch origin release
            git checkout release
            git reset --hard origin/release

            npm ci
            npm run build
            node --import dotenv/config -e "import('./dist/core/config.js').then(({ loadConfig }) => { const config = loadConfig(); console.log(JSON.stringify({ profile: config.BOT_PROFILE, databaseUrlConfigured: Boolean(config.DATABASE_URL) })); })"

            if command -v go >/dev/null 2>&1; then
              cd workers/japanese-worker
              go mod download
              go build -o japanese-worker .
              cd /opt/L4_DiscordBot
            else
              echo "Go is not installed on VPS. Install Go or prebuild workers/japanese-worker/japanese-worker before enabling JAPANESE_WORKER_ENABLED=1."
              exit 1
            fi

            sudo /bin/systemctl restart l4-discordbot
            sudo /bin/systemctl status l4-discordbot --no-pager
