name: Deploy release to VPS

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-release
      cancel-in-progress: true

    steps:
      - name: Check secrets are present
        run: |
          test -n "${{ secrets.VPS_HOST }}" || (echo "VPS_HOST is empty" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "VPS_USER is empty" && exit 1)
          test -n "${{ secrets.VPS_PORT }}" || (echo "VPS_PORT is empty" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "VPS_SSH_KEY is empty" && exit 1)
          echo "Secrets are present"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/L4_DiscordBot

            git fetch origin release
            git checkout release
            git reset --hard origin/release

            npm ci
            npm run build

            systemctl restart l4-discordbot
            systemctl status l4-discordbot --no-pager
