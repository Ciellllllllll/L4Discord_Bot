services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  bot:
    image: "${BOT_IMAGE:?BOT_IMAGE is required}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - "${BOT_ENV_FILE:-.env}"
    environment:
      BOT_PROFILE: production
      DATABASE_URL: "${BOT_DATABASE_URL:?BOT_DATABASE_URL is required}"
      PRODUCTION_DATABASE_URL: "${BOT_DATABASE_URL:?BOT_DATABASE_URL is required}"
      PRODUCTION_MESSAGE_ATTACHMENT_FILES_DIR: data/production/message_log_attachments
      PRODUCTION_USER_PROMPT_DIR: data/production/AI/prompt/user
      PRODUCTION_COLD_LAUGH_STORE_PATH: data/production/server/json/cold_laugh_counts.json
      PRODUCTION_ADHD_VIDEO_FILES_DIR: data/production/adhd-videos
      JAPANESE_WORKER_URL: http://127.0.0.1:8787
      PRODUCTION_JAPANESE_WORKER_URL: http://127.0.0.1:8787
      JAPANESE_WORKER_ENABLED: "${JAPANESE_WORKER_ENABLED:-1}"
      PRODUCTION_JAPANESE_WORKER_ENABLED: "${PRODUCTION_JAPANESE_WORKER_ENABLED:-1}"
      POSTGRES_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "${BOT_DATA_DIR:-./data/production}:/app/data/production"
      - "${BOT_LEGACY_ATTACHMENT_DATA_DIR:-./data/message_log_attachments}:/app/data/message_log_attachments:ro"

  tiny-ai:
    profiles: ["tiny-ai"]
    image: "${PACCHI_TINY_AI_IMAGE:-l4-tiny-ai:service}"
    build:
      context: ./experiments/tiny-ai
      dockerfile: Dockerfile.serve
    init: true
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: "${PACCHI_TINY_AI_MODEL_PATH:-/opt/l4-tiny-ai/runs/quality-v2/medium/best.pt}"
        target: /model/best.pt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
